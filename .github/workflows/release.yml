name: Publish CurseForge Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: curseforge-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check tag, changelog and production archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/publish_curseforge.py --tag "$RELEASE_TAG" --check
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/run_tests.py
      - name: Publish the tested production build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/publish_curseforge.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-receipt
          path: |
            releases/TotalWarcraft-*-release.zip
            releases/TotalWarcraft-*-release/manifest.json
            releases/curseforge-receipt.json
          if-no-files-found: ignore
