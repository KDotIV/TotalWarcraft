name: Publish CurseForge Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: curseforge-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check tag, changelog and production archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/publish_curseforge.py --tag "$RELEASE_TAG" --check
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/run_tests.py
      - name: Publish the tested production build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/publish_curseforge.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-receipt
          path: |
            releases/TotalWarcraft-*-release.zip
            releases/TotalWarcraft-*-release/manifest.json
            releases/curseforge-receipt.json
          if-no-files-found: ignore
